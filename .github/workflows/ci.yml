name: CI Work1
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest unit‑tests
        run: pytest test_app.py -v

      - name: SAST‑Bandit static source‑code scan
        run: bandit -r . -x test_app.py -f txt || true

      # ========== OWASP Dependency‑Check SCA (实验手册指定SCA工具) ==========
      - name: OWASP Dependency‑Check SCA Scan
        uses: dependency-check/Dependency-Check_Action@main
        id: depcheck
        with:
          project: "Work1‑Secure‑REST‑API‑Project"
          scan: "."
          format: "HTML"
          failOnCVSS: 10
          autoUpdate: true
          args: >
            --enableExperimental
            --exclude "**/.github/**"

      - name: Upload OWASP Dependency‑Check HTML report as artifact
        uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: OWASP‑Dependency‑Check‑Report
          path: ${{ steps.depcheck.outputs.report }}
          retention-days: 30
