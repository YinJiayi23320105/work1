name: CI
on: [push, pull_request]
jobs:
  test-and-security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit

      - name: Run pytest unit-test
        run: pytest test_app.py -v

      # SAST 静态源代码扫描 Bandit
      - name: SAST‑Bandit static security scan
        run: bandit -r . -x test_app.py -f txt || true

      # ========= SCA OWASP Dependency‑Check =========
      - name: SCA‑OWASP Dependency‑Check scan
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: "Work1‑Secure‑REST‑API"
          path: "."
          format: "HTML"
          out: reports
          args: >
            --enableExperimental
            --exclude "**/.github/**"
            --failOnCVSS 10
            --autoUpdate

      # 上传HTML报告作为流水线产物 artifact
      - name: Upload Dependency‑Check HTML report artifact
        uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: OWASP‑Dependency‑Check‑Report
          path: reports
          retention-days: 30
