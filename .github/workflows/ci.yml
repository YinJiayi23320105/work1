name: security-scan
on:
  push:
  pull_request:

jobs:
  bandit-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety -r requirements.txt
      - name: SAST scan with bandit
        run: bandit -r ./
      - name: Dependency scan with safety
        run: safety check
