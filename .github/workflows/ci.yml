name: CI
on: [push, pull_request]
jobs:
  test-and-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # 安装SAST工具 bandit、SCA工具 safety
          pip install bandit safety

      - name: Run pytest unit‑test
        run: pytest test_app.py -v

      # SAST 静态代码安全扫描 bandit
      - name: SAST‑Bandit static security scan
        run: bandit -r . -f txt

      # SCA 第三方组件漏洞扫描 safety
      - name: SCA‑Safety dependency vulnerability scan
        run: safety check

